[project]
name = "dealbench"
version = "0.1.0"
description = "Local-first dealership negotiation state engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]
# Only needed for LIVE GMAIL mode. Unit and replay modes run without them, which
# keeps the default test suite offline and free.
gmail = [
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "google-auth>=2.35",
    "cryptography>=43.0",
    "keyring>=25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:app.*"]
markers = [
    "live_gmail: hits a real Gmail account; skipped unless DEALBENCH_TEST_GMAIL=true",
]
# The default run stays offline and free. Live Gmail is opt-in.
addopts = "-m 'not live_gmail'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]
